worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format access_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","status":$status,"request_time":$request_time,"request_uri":"$request_uri","request_method":"$request_method","user":"$sent_http_x_demo_login_user"}';
  access_log /var/log/nginx/access.log access_json;
  error_log /var/log/nginx/error.log warn;
  sendfile on;
  server {
    listen 80;
    server_name _;
    location = /nginx_status {
      access_log off;
      stub_status;
      allow 172.28.0.0/16;
      deny all;
    }
    location / { proxy_pass http://demo-app:8000; proxy_set_header Host $host; }
  }
}
