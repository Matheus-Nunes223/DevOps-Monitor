[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "devops-monitor-collector"
version = "0.1.0"
description = "Python collector for the DevOps Monitor project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "APScheduler>=3.10,<4",
  "dnspython>=2.6,<3",
  "docker>=7.1,<8",
  "icmplib>=3,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
devops-monitor = "monitor.main:main"

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
